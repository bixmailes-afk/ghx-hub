<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Games</title>
</head>
<body>

<button onclick="openBlank()">Play Game</button>

<script>
function openBlank() {
  const blank = window.open("", "_blank");

  blank.document.write(`
    <!DOCTYPE html>
    <html>
    <head>
      <title>Games</title>
    </head>
    <body>
      <button onclick="window.location.href='https://kahoot.undo.it/'">
        Play Game
      </button>
    </body>
    </html>
  `);

  blank.document.close();
}
</script>

</body>
</html>
