<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: white;
      font-family: Arial, sans-serif;
    }

    .container {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button {
      padding: 14px 28px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }
  </style>
</head>

<body>
  <div class="container">
    <button onclick="window.open('https://kahoot.undo.it/', '_blank', 'noopener,noreferrer')">
      Open Game
    </button>
  </div>
</body>
</html>
